<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Cookies com Tema</title>
  <style>
    :root {
      --bg-color-light: #ffffff;
      --text-color-light: #000000;
      --bg-color-dark: #1e1e1e;
      --text-color-dark: #ffffff;
    }

    body.light-mode {
      background-color: var(--bg-color-light);
      color: var(--text-color-light);
    }

    body.dark-mode {
      background-color: var(--bg-color-dark);
      color: var(--text-color-dark);
    }

    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      transition: background-color 0.3s, color 0.3s;
    }

    input, button {
      margin-top: 10px;
      padding: 10px;
      font-size: 16px;
    }

    #temaToggle {
      margin-top: 20px;
      display: block;
      border: none;
      border-radius: 10px;
    }

    #formulario {
      width: 230px;
      background-color: aquamarine;
      border-radius: 15px;
      padding: 20px;
      justify-content: center;
      color: var(--text-color-light);
    }
  </style>
</head>
<body>

  <h1>Sistema de Cookies com Tema</h1>
  <p id="mensagem">Carregando...</p>

  <div id="formulario" style="display: none;">
    <label>Digite seu nome:</label><br>
    <input type="text" id="nome" placeholder="Seu nome">
    <button onclick="salvarCookie()">Salvar</button>
  </div>

  <button onclick="apagarCookie()" id="btnApagar" style="display:none; background-color: #ff4545;">Apagar Dados</button>


  <button onclick="alternarTema()" id="temaToggle">Alternar Tema</button>

  <script>
    // Cookie helpers
    function setCookie(nome, valor, dias) {
      const d = new Date();
      d.setTime(d.getTime() + (dias*24*60*60*1000));
      const expires = "expires=" + d.toUTCString();
      document.cookie = nome + "=" + encodeURIComponent(valor) + ";" + expires + ";path=/";
    }

    function getCookie(nome) {
      const nomeIgual = nome + "=";
      const partes = document.cookie.split(';');
      for (let i = 0; i < partes.length; i++) {
        let c = partes[i].trim();
        if (c.indexOf(nomeIgual) === 0) {
          return decodeURIComponent(c.substring(nomeIgual.length, c.length));
        }
      }
      return "";
    }

    function apagarCookie() {
      setCookie("usuario", "", -1);
      setCookie("tema", "", -1);
      location.reload();
    }

    function salvarCookie() {
      const nome = document.getElementById("nome").value;
      if (nome.trim() !== "") {
        setCookie("usuario", nome, 0.000072);
        mostrarMensagem(nome);
      }
    }

    function mostrarMensagem(nome) {
      document.getElementById("mensagem").innerText = "Bem-vindo, " + nome + "!";
      document.getElementById("formulario").style.display = "none";
      document.getElementById("btnApagar").style.display = "inline-block";
    }

    // Tema claro/escuro
    function aplicarTema(tema) {
      const temaToggle = document.getElementById("temaToggle");

      if (tema === "escuro") {
        document.body.classList.add("dark-mode");
        document.body.classList.remove("light-mode");
        temaToggle.textContent = 'Modo Claro';
        temaToggle.style.backgroundColor = '#ffffff';
        temaToggle.style.color = '#000000';
      } else {
        document.body.classList.add("light-mode");
        document.body.classList.remove("dark-mode");
        temaToggle.textContent = 'Modo Escuro';
        temaToggle.style.backgroundColor = '#1e1e1e';
        temaToggle.style.color = '#ffffff';
      }
    }

    function alternarTema() {
      const temaAtual = document.body.classList.contains("dark-mode") ? "escuro" : "claro";
      const novoTema = temaAtual === "escuro" ? "claro" : "escuro";
      aplicarTema(novoTema);
      setCookie("tema", novoTema, 7); // numero de dias: 7
    }

    // Inicialização
    window.onload = function() {
      const usuario = getCookie("usuario");
      const tema = getCookie("tema") || "claro"; // padrão: claro

      aplicarTema(tema);

      if (usuario !== "") {
        mostrarMensagem(usuario);
      } else {
        document.getElementById("mensagem").innerText = "Olá! Qual é o seu nome?";
        document.getElementById("formulario").style.display = "block";
      }
    }
  </script>

</body>
</html>
